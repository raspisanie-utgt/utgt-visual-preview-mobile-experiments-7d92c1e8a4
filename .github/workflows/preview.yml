name: Тестовая сборка и публикация УТЖТ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "preview-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview configuration
        uses: actions/checkout@v4

      - name: Checkout source site (isolated test branch)
        uses: actions/checkout@v4
        with:
          repository: raspisanie-utgt/raspisanie-utgt.github.io
          ref: claude/snow-mobile-redesign-v2
          path: source
          persist-credentials: false

      - name: Checkout current timetable data (main)
        uses: actions/checkout@v4
        with:
          repository: raspisanie-utgt/raspisanie-utgt.github.io
          ref: main
          path: current-data
          sparse-checkout: |
            data
          persist-credentials: false

      - name: Keep test timetable in sync with production
        run: cp -a current-data/data/. source/data/

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install pillow rcssmin rjsmin

      - name: Verify snow collisions and appearance rules
        run: cd source && node --test tests/appearance.test.js tests/snow-collision.test.js

      - name: Prepare test-only defaults and warning banner
        shell: python
        run: |
          from pathlib import Path
          base = Path('source/site')
          rules = base / 'appearance-rules.js'
          code = rules.read_text(encoding='utf-8')
          old = "const defaults = Object.freeze({ mode: 'off', manual: 'snow', intensity: 45"
          assert old in code, 'Cannot find expected appearance defaults'
          code = code.replace(old, "const defaults = Object.freeze({ mode: 'manual', manual: 'snow', intensity: 65", 1)
          # Separate preview preferences and offline cache from the production site,
          # even though both sites share the raspisanie-utgt.github.io origin.
          code = code.replace("'utgt-appearance-v1'", "'utgt-appearance-preview-v3'")
          code = code.replace("'utgt-ukhta-weather-v1'", "'utgt-ukhta-weather-preview-v1'")
          rules.write_text(code, encoding='utf-8')
          worker = base / 'sw.js'
          worker.write_text(worker.read_text(encoding='utf-8').replace('utgt-__BUILD__', 'utgt-preview-__BUILD__'), encoding='utf-8')
          page = base / 'index.html'
          html = page.read_text(encoding='utf-8')
          assert '<body' in html
          # Banner intentionally outside dialogs: this site is experimental.
          pos = html.index('>', html.index('<body')) + 1
          html = html[:pos] + '<div id="preview-notice" style="position:relative;z-index:99;text-align:center;padding:9px 12px;background:#6a4312;color:white;font:600 13px system-ui">⚠ ТЕСТОВАЯ ВЕРСИЯ · СНЕГ V3 · основной сайт не затронут</div>' + html[pos:]
          page.write_text(html, encoding='utf-8')

      - name: Build static site
        run: python source/build_site.py

      - name: Package small source archive for Claude (under 10 MB)
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("source")
          target = root / "_site" / "utgt-snow-claude-small.zip"
          files = [
              "site/appearance-renderer.js",
              "site/appearance.js",
              "site/appearance-rules.js",
              "site/appearance.css",
              "site/app.js",
              "site/index.html",
              "site/style.css",
              "site/sw.js",
              "site/force-refresh.js",
              "tests/snow-collision.test.js",
              "tests/appearance.test.js",
              "build_site.py",
          ]
          instructions = """# Задание Claude — исправить снег в существующем сайте УТЖТ

          В этом ZIP только нужный код (без тяжёлой истории замен и картинок).
          Код соответствует тестовой ветке claude/snow-mobile-redesign-v2, а файлы
          в site/ включают тестовые значения настроек, которые применяет сборка.

          Репозиторий: https://github.com/raspisanie-utgt/raspisanie-utgt.github.io
          Тестовый сайт: https://raspisanie-utgt.github.io/utgt-visual-preview-mobile-experiments-7d92c1e8a4/
          Основной сайт НЕ МЕНЯТЬ!

          Проблемы, замеченные на Android:
          1. Снег иногда стоит в воздухе, накапливается не в месте удара, а сплошной линией.
          2. Шапки неточно расположены и выходят за скруглённые углы, особенно при прокрутке.
          3. Примерно через минуту накопленный снег может исчезнуть: app.js
             периодически перестраивает .lesson через innerHTML; привязанные к DOM
             капы и данные попаданий теряются.
          4. Столкновение collision() проверяет только горизонтальную плоскость,
             не геометрию скруглений и не положение отдельных участков снега.
          5. Надо избежать лагов на Android, не запускать тяжёлые layout reads на каждом кадре.

          Нужно сохранить ИМЕННО интерактивную физику:
          - снежинки падают и при ударе по конкретной карточке исчезают из полёта;
          - снег растёт локально от попаданий с неодинаковой высотой вдоль карточки;
          - сугроб постоянно движется вместе с карточкой и не выступает за border-radius;
          - данные о накоплении переживают перерисовку DOM карточек;
          - по клику снег осыпается, а при окончании снегопада постепенно тает;
          - отключение эффекта убирает снег без зависших элементов;
          - качественно проверить Android, адаптивность и движение при прокрутке.

          Не подменять столкновения статичными декоративными полосками!
          Перед подготовкой PR объясни архитектуру и тесты.
          Все изменения ТОЛЬКО в отдельной тестовой ветке, не в main.
          """
          with ZipFile(target, "w", ZIP_DEFLATED, compresslevel=9) as z:
              for name in files:
                  source = root / name
                  assert source.is_file(), "Missing: " + name
                  z.write(source, name)
              z.writestr("README_FOR_CLAUDE.md", instructions)
          print(f"Claude archive: {target.stat().st_size:,} bytes")
          assert target.stat().st_size < 10_000_000, "Archive unexpectedly exceeds 10 MB"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        name: Deploy preview to GitHub Pages
        uses: actions/deploy-pages@v4
